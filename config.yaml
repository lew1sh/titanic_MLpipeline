project:
  random_state: 42
  target: Survived

data:
  train_path: data/train.csv
  test_path: data/test.csv
  results_path: outputs/results.csv
  submission_dir: outputs

validation:
  n_splits: 5
  shuffle: true
  scoring: accuracy

features:
  min_title_count: 10

models:
  baselines:
    enabled: true
  boosting:
    enabled: true
  ensembles:
    enabled: true
  mlp:
    enabled: true

model_params:
  logreg_none:
    penalty: null
    solver: lbfgs
    max_iter: 1000

  logreg_l1:
    penalty: l1
    solver: liblinear
    max_iter: 1000

  logreg_l2:
    penalty: l2
    solver: lbfgs
    max_iter: 1000

  logreg_elastic:
    penalty: elasticnet
    solver: saga
    l1_ratio: 0.5
    C: 1.0
    max_iter: 5000

  knn_3:
    n_neighbors: 3

  knn_5:
    n_neighbors: 5

  knn_7_distance:
    n_neighbors: 7
    weights: distance

  tree_depth_3:
    max_depth: 3

  tree_depth_5:
    max_depth: 5

  rf_100:
    n_estimators: 100

  rf_300_depth_5:
    n_estimators: 300
    max_depth: 5

  catboost:
    iterations: 300
    depth: 4
    learning_rate: 0.05
    loss_function: Logloss
    verbose: false
    allow_writing_files: false

  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    verbose: -1

  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
    eval_metric: logloss

  voting_rf:
    n_estimators: 300
    max_depth: 5

  stacking_rf:
    n_estimators: 300
    max_depth: 5

  stacking_tree:
    max_depth: 5

  mlp:
    hidden_layer_sizes:
      - 64
      - 32
    activation: relu
    alpha: 0.0001
    max_iter: 500
